name: city_guest_flutter
description: "City Guest Relation Management Flutter Application for Mobile, Tablet, and Windows Desktop connected to Supabase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.70.0
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6
  image_picker: ^1.1.2
  file_picker: ^9.0.0
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/full_mkc_logo.png
    - assets/hero.png
