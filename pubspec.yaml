name: city_guest_flutter
description: "City Guest Relation Management Flutter Application for Mobile, Tablet, and Windows Desktop connected to Supabase."
publish_to: 'none'
version: 1.0.3+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.8.0
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.70.0
  pdf: ^3.11.1
  printing: ^5.13.0
  excel: ^4.0.6
  image_picker: ^1.1.2
  file_picker: ^9.0.0
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.5
  flutter_local_notifications: ^18.0.1
  onesignal_flutter: ^5.2.5
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#064E3B"

flutter:
  uses-material-design: true
  assets:
    - assets/full_mkc_logo.png
    - assets/logo.png
    - assets/hero.png
